name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # エンジンは GUI に依存しないので、X11 も GL も無しで検証できる。
      - name: test
        run: dotnet test tests/DeepCompare.Engine.Tests/DeepCompare.Engine.Tests.csproj

      # LLM 支援。**本物の HTTP を流して確かめる**（模擬サーバーを立てる）ので、
      # 外部への接続は要らない。
      - name: test (assist)
        run: dotnet test tests/DeepCompare.Assist.Tests/DeepCompare.Assist.Tests.csproj

      # 自前で書いた BERT が独立実装と一致することの確認。ここが崩れたら
      # 類似度も対応付けも意味を持たないので、CI で押さえる。
      - name: 参照実装との突き合わせ
        run: |
          B=https://huggingface.co/sentence-transformers/paraphrase-MiniLM-L6-v2/resolve/main
          mkdir -p assets/src
          curl -sSL -o assets/src/model.onnx "$B/onnx/model.onnx"
          curl -sSL -o assets/src/vocab.txt "$B/vocab.txt"
          python3 -m venv .venv-ref
          .venv-ref/bin/pip install --quiet onnxruntime numpy tokenizers
          .venv-ref/bin/python tools/reference_embeddings.py
          dotnet test tests/DeepCompare.Engine.Tests/DeepCompare.Engine.Tests.csproj \
            --filter "EmbeddingsMatchTheReferenceImplementation" --logger "console;verbosity=detailed"

      # **画面を開かない経路が壊れていないか。** ここが崩れると、CI から
      # 呼んだときに GUI が立ち上がって固まる（実際に Windows で踏んだ）。
      - name: CLI の終了コード
        run: |
          dotnet build src/DeepCompare.App/DeepCompare.App.csproj -c Debug
          ./tools/cli-smoke.sh src/DeepCompare.App/bin/Debug/net10.0/deepcompare

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: deepcompare-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: deepcompare-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT のリンクに要るもの。Windows ランナーには MSVC が既に入っている。
      - name: Linux の依存を導入
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 発行
        run: >
          dotnet publish src/DeepCompare.App/DeepCompare.App.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o out

      - name: サイズを表示
        shell: bash
        run: ls -l out/ | grep -v '\.pdb\|\.dbg'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/*
            !out/*.pdb
            !out/*.dbg
