[package]
name = "deepcompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "deepcompare"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
deepcompare-engine = { path = "../engine" }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
# 既定で xdg-portal（Linux）と Win32（Windows）を使う。GTK を要求しないので
# クロスビルドの前提が増えない。
rfd = "0.17"
# egui/epaint が文字を描くのに使っているのと同じ書体エンジン。これで読めるかを
# 調べれば、実際に画面へ出るかを描画せずに判定できる。依存ツリーには既にある。
skrifa = "0.44"
