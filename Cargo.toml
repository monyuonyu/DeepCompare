[workspace]
resolver = "2"
members = ["crates/engine", "crates/app", "crates/model-prep"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/monyuonyu/DeepCompare"

[workspace.dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
encoding_rs = "0.8"
half = "2"
rayon = "1"
safetensors = "0.8"
similar = "3"
# fancy-regex は純 Rust。既定の onig は C 実装で、Windows へのクロスビルドに
# mingw を要求するうえ、使うのは WordPiece だけなので必要ない。
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# 単一 exe を小さくするための設定。モデルを埋め込むぶん、コード側は削れるだけ削る。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
